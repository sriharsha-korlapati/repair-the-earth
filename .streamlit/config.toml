# The chart palette in ui/theme.py was contrast- and colour-vision-validated
# against the dark surface #0f172a specifically, so the theme is pinned to dark
# rather than following the viewer's OS setting. A light-mode flip would put
# every series colour on a surface it was never checked against.
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#0f172a"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
# CORS and XSRF protection are left at their secure defaults. v1 disabled both,
# which is a habit picked up from local tunnelling; on a public host it weakens
# the app for no benefit. Streamlit Community Cloud sets its own server config
# anyway, so nothing here is load-bearing for deployment.

[browser]
gatherUsageStats = false
